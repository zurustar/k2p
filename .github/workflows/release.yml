name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build-and-release:
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Install fyne CLI
        run: go install fyne.io/fyne/v2/cmd/fyne@v2.7.1

      - name: Build .app bundle
        run: make build

      - name: Create zip archive
        run: |
          cd build
          zip -r k2p-gui-${{ github.ref_name }}-darwin.zip k2p-gui.app

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: build/k2p-gui-${{ github.ref_name }}-darwin.zip
          generate_release_notes: true
